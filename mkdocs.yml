site_name: My Engineering Notes
site_description: Personal engineering notes - Spring Boot, React, React Native, DSA & System Design
repo_url: https://github.com/YOUR_USERNAME/YOUR_REPO
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Frontend:
      - JavaScript:
          - Hoisting: frontend/javascript/hoisting.md
  - Backend:
      - Spring Boot: backend/spring-boot/index.md
  - Mobile:
      - React Native: mobile/react-native/index.md
  - System Design: system-design/index.md
  - DSA: dsa/index.md
