site_name: My Engineering Notes
site_description: Personal engineering notes - Spring Boot, React, React Native, DSA & System Design
repo_url: https://github.com/YOUR_USERNAME/YOUR_REPO
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Frontend:
      - JavaScript:
          - Hoisting: frontend/javascript/hoisting.md
          - Closures: frontend/javascript/closures.md
          - Temporal Dead Zone: frontend/javascript/tdz.md
          - var vs let vs const: frontend/javascript/var-let-const.md
          - Event Loop: frontend/javascript/event-loop.md
          - Promises: frontend/javascript/promises.md
          - Async/Await vs Promises: frontend/javascript/async-await-vs-promises.md
          - The this Keyword: frontend/javascript/this-keyword.md
          - Call, Apply, Bind: frontend/javascript/call-apply-bind.md
          - Debounce vs Throttle: frontend/javascript/debounce-vs-throttle.md
          - Higher-Order Functions: frontend/javascript/higher-order-functions.md
          - Map/Set vs Object/Array: frontend/javascript/map-set-vs-object-array.md
          - Web Workers: frontend/javascript/web-workers.md
      - React:
          - Virtual DOM & Reconciliation: frontend/react/virtual-dom-reconciliation.md
          - useEffect Deep Dive: frontend/react/useeffect-deep-dive.md
          - useMemo vs useCallback: frontend/react/usememo-vs-usecallback.md
          - Custom Hooks: frontend/react/custom-hooks.md
          - Context API vs Redux/Zustand: frontend/react/context-vs-redux-zustand.md
          - Re-renders & Performance: frontend/react/rerenders-and-performance.md
          - Controlled vs Uncontrolled: frontend/react/controlled-vs-uncontrolled.md
          - Error Boundaries: frontend/react/error-boundaries.md
          - SSR & Hydration: frontend/react/ssr-and-hydration.md
          - Suspense & Lazy Loading: frontend/react/suspense-and-lazy-loading.md
  - Backend:
      - Spring Boot: backend/spring-boot/index.md
  - Mobile:
      - React Native: mobile/react-native/index.md
  - System Design: system-design/index.md
  - DSA: dsa/index.md
